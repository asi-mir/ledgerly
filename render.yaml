# Render Blueprint: one free web service + one free Postgres.
# Leave out `plan: free` and Render picks a paid plan, so it is set on both.
services:
  - type: web
    name: ledgerly
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_TELEGRAM_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TABPFN_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: GEMMA_PROVIDER
        value: aistudio
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: CURRENCY
        value: $
      - key: TIMEZONE
        value: Europe/Istanbul
      - key: SENTRY_ENVIRONMENT
        value: render
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerly-db
          property: connectionString

databases:
  - name: ledgerly-db
    plan: free
    region: frankfurt
    databaseName: ledgerly
    user: ledgerly
